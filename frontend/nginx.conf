# nginx config for the Vite SPA.
#
# Highlights
# ----------
# * SPA fallback: any path that doesn't match a real asset is served
#   ``index.html`` so React Router can handle it.
# * Long-cache hashed assets (Vite emits content-hashed filenames), but
#   never cache ``index.html`` so new deploys are picked up on reload.
# * gzip on the usual text types keeps payloads small without relying on
#   a CDN.

server {
    listen      80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak the nginx version in headers.
    server_tokens off;

    # ----- static asset caching -------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ----- SPA fallback ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # ----- compression ----------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;
}
